name: ecocycle
description: "EcoCycle citizen mobile application for recycling points and waste awareness."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  http: ^1.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/eco.png
    - assets/branding/splash_logo.png
    - assets/branding/google_logo.png